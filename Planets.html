<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="planets.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Voyage</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    
<section id="Home">

    <!-- NAVBAR -->

    <div class="NavBar">

        <div class="logo-text">

            <div class="logo-text-sec">
                <img src="logo.png" alt="" id="logo-sec">
            </div>

            <div class="text-sec-logo">
                <p>SpaceVoyage</p>
            </div>

        </div>

        <div class="the-five-buttons">

            <a href="index.html">
                <button class="btn">Home</button>
            </a>

            <a href="Planets.html" target="_blank">
                <button class="btn">Planets</button>
            </a>

            <a href="Missions.html" target="_blank">
                <button class="btn">Missions</button>
            </a>

            <a href="Gallery.html" target="_blank">
                <button class="btn">Gallery</button>
            </a>

            <a href="About.html" target="_blank">
                <button class="btn">About</button>
            </a>

        </div>

        <div class="Get-started-button">

            <a href="#discover">
                <button class="btn2">Get started</button>
            </a>

        </div>

    </div>

    <!-- HEADER -->

    <div class="text-header">

        <h1>Our Planets</h1>

        <p>
            Learn more about the planets
            <br>
            in our solar system
        </p>

    </div>

    <!-- MAIN HOME SECTION -->

    <div class="Home">

        <!-- LEFT PLANETS SECTION -->

        <div class="Planets-images-texts-section">

            <div class="Planets-imgs-texts-section">
                <div class="planet-sec">

                    <button class="eight-btns active">
                        <img src="Mercury.png" alt="" class="image-planet">
                        Mercury
                    </button>

                </div>
            </div>

            <div class="Planets-imgs-texts-section">
                <div class="planet-sec">

                    <button class="eight-btns">
                        <img src="venus.png" alt="" class="image-planet">
                        Venus
                    </button>

                </div>
            </div>

            <div class="Planets-imgs-texts-section">
                <div class="planet-sec">

                    <button class="eight-btns">
                        <img src="Earth.png" alt="" class="image-planet">
                        Earth
                    </button>

                </div>
            </div>

            <div class="Planets-imgs-texts-section">
                <div class="planet-sec">

                    <button class="eight-btns">
                        <img src="Mars.png" alt="" class="image-planet">
                        Mars
                    </button>

                </div>
            </div>

            <div class="Planets-imgs-texts-section">
                <div class="planet-sec">

                    <button class="eight-btns">
                        <img src="jupiter.png" alt="" class="image-planet">
                        Jupiter
                    </button>

                </div>
            </div>

            <div class="Planets-imgs-texts-section">
                <div class="planet-sec">

                    <button class="eight-btns">
                        <img src="Saturn.png" alt="" class="image-planet">
                        Saturn
                    </button>

                </div>
            </div>

            <div class="Planets-imgs-texts-section">
                <div class="planet-sec">

                    <button class="eight-btns">
                        <img src="Uranus.png" alt="" class="image-planet">
                        Uranus
                    </button>

                </div>
            </div>

            <div class="Planets-imgs-texts-section">
                <div class="planet-sec">

                    <button class="eight-btns">
                        <img src="Neptun.png" alt="" class="image-planet">
                        Neptune
                    </button>

                </div>
            </div>

        </div>

        <!-- RIGHT INFO SECTION -->

        <div id="info-sec">

            <div class="info-sec">

                <h1>Mercury</h1>

                <p>
                    Mercury is the smallest planet and <br>
                    the closest to the Sun. It has a <br>
                    rocky surface and experiences <br>
                    extreme temperature variations.
                </p>

            </div>

            <!-- FOUR INFO BOXES -->

            <div class="all-four-sections">

                <!-- FIRST -->

                <div class="four-sec">

                    <div class="icon">
                        <img src="distance-icon.png" alt="" class="icon-img">
                    </div>

                    <div class="main-text">
                        <h3>Distance from Sun</h3>
                        <p>57.9M km</p>
                    </div>

                </div>

                <!-- SECOND -->

                <div class="four-sec">

                    <div class="icon">
                        <img src="diameter-icon.png" alt="" class="icon-img">
                    </div>

                    <div class="main-text">
                        <h3>Diameter</h3>
                        <p>4,879 km</p>
                    </div>

                </div>

                <!-- THIRD -->

                <div class="four-sec">

                    <div class="icon">
                        <img src="Moon-icon.png" alt="" class="icon-img">
                    </div>

                    <div class="main-text">
                        <h3>Moons</h3>
                        <p>0</p>
                    </div>

                </div>

                <!-- FOURTH -->

                <div class="four-sec">

                    <div class="icon">
                        <img src="no-year-icon.png" alt="" class="icon-img">
                    </div>

                    <div class="main-text">
                        <h3>Length of Year</h3>
                        <p>88 days</p>
                    </div>

                </div>

            </div>

        </div>

    </div>

</section>
